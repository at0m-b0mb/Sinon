name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install build
      - run: python -m build

      - name: Verify the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python3 -c "import re,pathlib;print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('sinon/version.py').read_text()).group(1))")
          test "$tag" = "$pkg" || { echo "tag $tag != version $pkg"; exit 1; }

      - name: Sample report to attach
        run: |
          pip install -e .
          sinon demo --profile naive --quiet --no-color --fail-on none \
            --html dist/example-report.html

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/example-report.html
